{% extends 'catalog/base.html' %}

{% block content %}
<div class="container">
    <h1>{% if object %}Редактировать запись{% else %}Создать запись{% endif %}</h1>
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-primary">Сохранить</button>
        <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Отмена</a>
    </form>
</div>
{% endblock %}
