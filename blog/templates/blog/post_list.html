{% extends 'catalog/base.html' %}

{% block content %}
<div class="container">
    <h1>Блог</h1>
    <a href="{% url 'blog:post_create' %}" class="btn btn-primary mb-3">Добавить пост</a>
    <a href="{% url 'home' %}" class="btn btn-primary mb-3">Назад на главную</a>
    <div class="row">
        {% for post in posts %}
        <div class="col-md-4">
            <div class="card h-100 mb-4">
                {% if post.preview %}
                <img src="{{ post.preview.url }}" class="card-img-top" style="height: 250px; object-fit: cover;">
                {% endif %}
                <div class="card-body">
                    <h5 class="card-title">{{ post.title }}</h5>
                    <p class="card-text">{{ post.content|truncatechars:100 }}</p>
                    <p><small>Просмотров: {{ post.views_count }}</small></p>
                    <a href="{% url 'blog:post_detail' post.pk %}" class="btn btn-primary">Читать</a>
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
