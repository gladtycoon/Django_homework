{% extends 'catalog/base.html' %}

{% block content %}
<div class="container">
    <h1>{{ post.title }}</h1>
    <p><small>Опубликовано: {{ post.created_at|date:"d.m.Y" }} | Просмотров: {{ post.views_count }}</small></p>
    {% if post.preview %}
    <img src="{{ post.preview.url }}" class="img-fluid mb-3" style="max-height: 400px;">
    {% endif %}
    <p>{{ post.content|linebreaks }}</p>
    <a href="{% url 'blog:post_list' %}" class="btn btn-secondary">Назад</a>
    <a href="{% url 'blog:post_update' post.pk %}" class="btn btn-warning">Редактировать</a>
    <a href="{% url 'blog:post_delete' post.pk %}" class="btn btn-danger">Удалить</a>
</div>
{% endblock %}
