{% extends 'catalog/base.html' %}
{% load my_tags %}
{% block content %}
<div class="album py-5 bg-body-tertiary">
        <div class="container">
            <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 g-3">
                <div class="col">
                    <div class="card shadow-sm">
                        <img src="{{ product.image | media_filter }}" class="card-img-top">
                        <div class="card-body">
                            <p class="card-text">Наименование: {{ object.name| upper }}</p>
                            <p class="card-text">Описание: {{ object.description }}</p>
                            <p class="card-text">Стоимость: {{ object.price }}</p>
                            <p class="card-text">Категория товаров: {{ object.category }}</p>
                            <div class="d-flex justify-content-between align-items-center">
                                <div class="btn-group">
                                    <a class="btn btn-secondary" href="{% url 'catalog:product_list' %}" role="button">Назад к списку</a>
                                    <a href="{% url 'catalog:product_update' product.pk %}" class="btn btn-warning">Редактировать</a>
                                    <a class="btn btn-danger" href="{% url 'catalog:product_delete' product.pk %}" role="button">Удалить</a>
                                </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
{% endblock %}
